<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>재난 모니터링</title>
  <style>
    body {
      background: #181a1b;
      color: #eebbc3;
      font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #121629;
      padding: 2rem 0 1rem 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      color: #eebbc3;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
    }
    .video-box {
      background: #393e6a;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      padding: 2.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .video-box img {
      border-radius: 0.5rem;
      border: 4px solid #eebbc3;
      max-width: 80vw;
      max-height: 70vh;
      background: #232946;
      box-sizing: border-box;
      display: block;
    }
    footer {
      background: #121629;
      color: #b8c1ec;
      text-align: center;
      padding: 1rem 0;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .video-box img { max-width: 100vw; max-height: 30vh; }
      .video-box { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>재난 모니터링 시스템</h1>
  </header>
  <main>
    <div class="video-box">
      <img src="http://222.231.24.5:5000/video_feed" alt="실시간 재난 감시 영상" />
    </div>
  </main>
  <footer>
    실시간 객체 감지 기반 재난 모니터링 시스템 &middot; YOLOv5n 적용<br>
    위험 상황 발생 시 즉각적인 대응을 위한 영상 모니터링 플랫폼
  </footer>
</body>
</html>
