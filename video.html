<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>재난 모니터링</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --dark-gray: #181a1b;
      --mid-gray: #232326;
      --accent: #eebbc3;
      --text: #f4f4f4;
      --subtext: #b8c1ec;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--dark-gray);
      color: var(--text);
      font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif;
      min-height: 100vh;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      width: 100%;
      background: var(--mid-gray);
      padding: 2rem 0 1rem 0;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 1rem 0;
    }
    .video-wrap {
      background: var(--mid-gray);
      border-radius: 1.2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 95vw;
      margin-bottom: 2rem;
    }
    .video-wrap img {
      border-radius: 0.7rem;
      border: 3px solid var(--accent);
      max-width: 90vw;
      max-height: 70vh;
      background: var(--dark-gray);
      display: block;
      box-sizing: border-box;
    }
    footer {
      width: 100%;
      background: var(--mid-gray);
      color: var(--subtext);
      text-align: center;
      padding: 1.2rem 0 1.2rem 0;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.2rem; }
      .video-wrap { padding: 0.7rem; }
      .video-wrap img { max-width: 98vw; max-height: 32vh; }
      main { padding: 1rem 0 0.5rem 0; }
      footer { font-size: 0.95rem; padding: 0.7rem 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>재난 모니터링 시스템</h1>
  </header>
  <main>
    <div class="video-wrap">
      <img src="http://222.231.24.5:5000/video_feed" alt="실시간 재난 감시 영상" />
    </div>
  </main>
  <footer>
    실시간 객체 감지 기반 재난 모니터링 &middot; YOLOv5n 적용<br>
    위험 상황 발생 시 즉각적인 대응을 위한 영상 모니터링 플랫폼
  </footer>
</body>
</html>
